name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Extract ZIP
        run: |
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \; || true
          if [ ! -f "build.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Moving files from $SUBDIR to root..."
              cp -r "$SUBDIR"/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLauncher-Samsung-TabA7Lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
